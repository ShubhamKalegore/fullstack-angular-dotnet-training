<div class="card p-4">

    <h3 class="mb-4">
        User Login
    </h3>

    <form [formGroup]="form" (ngSubmit)="login()">

        <!-- Email -->

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email" class="form-control" formControlName="email">

        </div>

        <!-- Password -->

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <input
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control"
                    formControlName="password">

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                    [attr.aria-pressed]="showPassword"
                    [title]="showPassword ? 'Hide password' : 'Show password'">

                    <svg
                        *ngIf="!showPassword"
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>

                    <svg
                        *ngIf="showPassword"
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.7 5.1A10.9 10.9 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-3.1 4.4"></path>
                        <path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"></path>
                        <path d="M6.6 6.6A13.2 13.2 0 0 0 2 12s3 7 10 7a10.9 10.9 0 0 0 4.2-.8"></path>
                    </svg>

                </button>

            </div>

        </div>

        <!-- Success -->

        <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
        </div>

        <!-- Error -->

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <!-- Logged In User -->

        <div *ngIf="loggedInRole" class="alert alert-info">

            <h5>
                Logged In User Details
            </h5>

            <p>
                User Id:
                {{ loggedInUserId }}
            </p>

            <p>
                Role:
                {{ loggedInRole }}
            </p>

        </div>

        <!-- Submit -->

        <div class="mb-3">
            <span>New user? </span>

            <button type="button" class="btn btn-link p-0" (click)="signupClicked.emit()">
                Sign up
            </button>
        </div>

        <button type="submit" class="btn btn-success" [disabled]="form.invalid">
            Login
        </button>

    </form>

</div>
